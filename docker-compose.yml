services:
  ollama:
    image: ollama/ollama
    container_name: ollama_container
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  llm:
    build:
      context: ./llm
    container_name: llm
    depends_on:
      - ollama
    ports:
      - "8000:8000"

  elasticsearch:
    image: elasticsearch:9.0.2
    container_name: elasticsearch_container
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx3g
    ports:
      - "9200:9200"

  kibana:
    image: kibana:9.0.2
    container_name: kibana_container
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: bot_container
    depends_on:
      - llm
      - elasticsearch
    environment:
      - BOT_TOKEN=7054060072:AAGvKAWZnuIdD3wwk8pI2HnoW1-K8thw8_w

volumes:
  ollama: